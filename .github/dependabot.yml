version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/templates/javascript"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/templates/nui-vite/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/templates/nui-svelte/web"
    schedule:
      interval: "weekly"
