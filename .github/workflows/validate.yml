name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate plugin.json
        run: python3 -c "import json; json.load(open('.cursor-plugin/plugin.json'))"

      - name: Validate mcp.json
        run: python3 -c "import json; json.load(open('.cursor/mcp.json'))"

      - name: Validate natives_gta5.json
        run: |
          python3 << 'EOF'
          import json
          data = json.load(open('mcp-server/data/natives_gta5.json'))
          assert isinstance(data, list), 'Expected array'
          for n in data:
              assert 'name' in n, f'Missing name in {n}'
              assert 'hash' in n, f'Missing hash in {n.get("name", "unknown")}'
              assert 'side' in n, f'Missing side in {n.get("name", "unknown")}'
              assert 'category' in n, f'Missing category in {n.get("name", "unknown")}'
              assert isinstance(n.get('deprecated'), bool), f'deprecated must be bool in {n.get("name", "unknown")}'
              assert n.get('examples') is None or isinstance(n.get('examples'), str), f'examples must be string or null in {n.get("name", "unknown")}'
              assert isinstance(n.get('hash'), str), f'hash must be a string in {n.get("name", "unknown")}'
              assert isinstance(n.get('description'), str), f'description must be a string in {n.get("name", "unknown")}'
              assert all(isinstance(p, dict) and 'type' in p and 'name' in p for p in (n.get('params') or [])), f'params need type and name in {n.get("name", "unknown")}'
          print(f'GTA5 natives: {len(data)} entries validated')
          EOF

      - name: Validate natives_rdr3.json
        run: |
          python3 << 'EOF'
          import json
          data = json.load(open('mcp-server/data/natives_rdr3.json'))
          assert isinstance(data, list), 'Expected array'
          for n in data:
              assert 'name' in n, f'Missing name in {n}'
              assert 'hash' in n, f'Missing hash in {n.get("name", "unknown")}'
              assert 'side' in n, f'Missing side in {n.get("name", "unknown")}'
              assert 'category' in n, f'Missing category in {n.get("name", "unknown")}'
              assert isinstance(n.get('deprecated'), bool), f'deprecated must be bool in {n.get("name", "unknown")}'
              assert n.get('examples') is None or isinstance(n.get('examples'), str), f'examples must be string or null in {n.get("name", "unknown")}'
              assert isinstance(n.get('hash'), str), f'hash must be a string in {n.get("name", "unknown")}'
              assert isinstance(n.get('description'), str), f'description must be a string in {n.get("name", "unknown")}'
              assert all(isinstance(p, dict) and 'type' in p and 'name' in p for p in (n.get('params') or [])), f'params need type and name in {n.get("name", "unknown")}'
          print(f'RDR3 natives: {len(data)} entries validated')
          EOF

      - name: Validate events.json
        run: |
          python3 << 'EOF'
          import json
          data = json.load(open('mcp-server/data/events.json'))
          assert isinstance(data, list), 'Expected array'
          for e in data:
              assert 'name' in e, f'Missing name in {e}'
              assert 'side' in e, f'Missing side in {e.get("name", "unknown")}'
              assert 'framework' in e, f'Missing framework in {e.get("name", "unknown")}'
              assert 'game' in e, f'Missing game in {e.get("name", "unknown")}'
          print(f'Events: {len(data)} entries validated')
          EOF

      - name: Validate docs_index.json
        run: |
          python3 << 'EOF'
          import json
          data = json.load(open('mcp-server/data/docs_index.json'))
          assert isinstance(data, list), 'Expected array'
          for page in data:
              assert 'title' in page, f'Missing title'
              assert 'url' in page, f'Missing url'
              assert 'section' in page, f'Missing section'
          print(f'Docs index: {len(data)} pages validated')
          EOF

  validate-plugin-manifest:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check required manifest fields
        run: |
          python3 << 'EOF'
          import json
          m = json.load(open('.cursor-plugin/plugin.json'))
          required = ['name', 'displayName', 'description', 'version', 'author', 'license', 'skills', 'rules']
          missing = [f for f in required if f not in m]
          assert not missing, f'Missing fields: {missing}'
          import re
          assert re.match(r'^[a-z0-9]+(-[a-z0-9]+)*$', m['name']), 'name must be lowercase kebab-case'
          print('Plugin manifest valid')
          EOF

      - name: Check skill files exist
        run: |
          python3 << 'EOF'
          import json, os
          m = json.load(open('.cursor-plugin/plugin.json'))
          for skill in m.get('skills', []):
              assert os.path.exists(skill), f'Skill not found: {skill}'
          print(f'All {len(m["skills"])} skill files exist')
          EOF

      - name: Check rule files exist
        run: |
          python3 << 'EOF'
          import json, os
          m = json.load(open('.cursor-plugin/plugin.json'))
          for rule in m.get('rules', []):
              assert os.path.exists(rule), f'Rule not found: {rule}'
          print(f'All {len(m["rules"])} rule files exist')
          EOF

  validate-content:
    name: Validate content quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for em dashes and en dashes
        run: |
          if grep -rP '[\x{2013}\x{2014}]' --include='*.md' --include='*.lua' --include='*.js' --include='*.cs' --include='*.mdc' --include='*.json' --include='*.py' . 2>/dev/null; then
            echo "::error::Em dashes or en dashes found. Use hyphens instead."
            exit 1
          fi
          echo "No em/en dashes found"

      - name: Check for hardcoded credentials
        run: |
          patterns='password\s*=\s*["\x27][^"\x27]+|api_key\s*=\s*["\x27][^"\x27]+|token\s*=\s*["\x27][A-Za-z0-9]+'
          # Filter on the matched text only (not the whole line or path), so
          # files under examples/ are still checked. Placeholder values are
          # allowed. Only path:line is printed, never the matched value.
          matches=$(grep -rPion "$patterns" --include='*.lua' --include='*.js' --include='*.py' --include='*.json' --exclude-dir=.git --exclude-dir=node_modules . 2>/dev/null || true)
          hits=$(printf '%s\n' "$matches" | awk '{
            if (!match($0, /:[0-9]+:/)) next
            loc = substr($0, 1, RSTART + RLENGTH - 2)
            value = tolower(substr($0, RSTART + RLENGTH))
            if (value ~ /your[_-]|example|placeholder|mock|changeme|<[a-z_-]+>|\$\{/) next
            print loc
          }')
          if [ -n "$hits" ]; then
            echo "::error::Possible hardcoded credentials found:"
            echo "$hits"
            exit 1
          fi
          echo "No hardcoded credentials found"

      - name: Check deprecated lua54 directive in templates
        run: |
          if grep -r "lua54" templates/ 2>/dev/null; then
            echo "::error::lua54 directive found in templates. It is deprecated and should be removed."
            exit 1
          fi
          echo "No deprecated lua54 in templates"

  validate-counts:
    name: Validate content counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check skill and snippet counts match plugin.json
        run: |
          python3 << 'EOF'
          import json, os, sys

          m = json.load(open('.cursor-plugin/plugin.json'))
          errors = []

          skill_count = len(m.get('skills', []))
          rule_count = len(m.get('rules', []))

          snippet_count = sum(
              len(files)
              for root, dirs, files in os.walk('snippets')
              if files
          )

          template_count = sum(
              1 for d in os.listdir('templates')
              if os.path.isdir(os.path.join('templates', d))
              and os.path.exists(os.path.join('templates', d, 'fxmanifest.lua'))
          )

          readme = open('README.md').read()
          if f'{skill_count} skills' not in readme:
              errors.append(f'README skill count mismatch (expected {skill_count})')
          if f'{snippet_count} snippets' not in readme:
              errors.append(f'README snippet count mismatch (expected {snippet_count})')
          if f'{template_count} templates' not in readme:
              errors.append(f'README template count mismatch (expected {template_count})')
          if f'{rule_count} rules' not in readme:
              errors.append(f'README rule count mismatch (expected {rule_count})')

          if errors:
              for e in errors:
                  print(f'::error::{e}', file=sys.stderr)
              sys.exit(1)

          print(f'Counts verified: {skill_count} skills, {rule_count} rules, {snippet_count} snippets, {template_count} templates')
          EOF

  validate-templates:
    name: Validate templates, examples and snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check fxmanifest.lua files have required fields
        run: |
          python3 << 'EOF'
          import re, subprocess, sys

          files = subprocess.check_output(
              ["git", "ls-files", "templates/*/fxmanifest.lua", "examples/*/fxmanifest.lua"], text=True
          ).split()
          errors = []
          for path in files:
              content = open(path, encoding="utf-8").read()
              if not re.search(r"^fx_version 'cerulean'", content, re.M):
                  errors.append(f"{path}: missing fx_version 'cerulean'")
              if not re.search(r"^games? [{']", content, re.M):
                  errors.append(f"{path}: missing games declaration")

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(files)} fxmanifest.lua files valid")
          EOF

      - name: Validate template package.json files
        run: |
          python3 << 'EOF'
          import json, subprocess
          files = subprocess.check_output(["git", "ls-files", "templates/**package.json"], text=True).split()
          for path in files:
              json.load(open(path, encoding="utf-8"))
          print(f"{len(files)} package.json files valid")
          EOF

      - name: Syntax-check JavaScript (snippets, templates, examples)
        run: |
          # Bundler-only sources under web/ (TS, Svelte) are built by their own tooling.
          status=0
          for f in $(git ls-files 'snippets/*.js' 'templates/*.js' 'examples/*.js' | grep -v '/web/'); do
            node --check "$f" || { echo "::error file=$f::JavaScript syntax error"; status=1; }
          done
          exit $status

      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Syntax-check Lua (snippets, templates, examples, all .lua)
        run: |
          status=0
          tmp=$(mktemp --suffix=.lua)
          for f in $(git ls-files '*.lua'); do
            # CfxLua compile-time hashes (`adder`) are not stock Lua syntax.
            sed 's/`[^`]*`/0/g' "$f" > "$tmp"
            if ! out=$(luac5.4 -p "$tmp" 2>&1); then
              echo "::error file=$f::${out//$tmp/$f}"
              status=1
            fi
          done
          exit $status

  validate-python:
    name: Validate MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r mcp-server/requirements-dev.txt

      - name: Check Python syntax (all modules)
        run: python -m compileall -q mcp-server .github/scripts

      - name: Import server and check tool registration
        working-directory: mcp-server
        run: python -c "import asyncio, server; tools = asyncio.run(server.mcp.list_tools()); assert len(tools) == 10, [t.name for t in tools]; print(len(tools), 'tools registered')"

      - name: Smoke-call data tools
        working-directory: mcp-server
        run: |
          python -c "import server; assert server.search_events_tool('').startswith('Event reference database'); assert server.search_docs_tool('').startswith('Documentation index'); assert server.search_docs_tool('x', section='bogus').startswith('Error: invalid section'); assert 'GetPlayerPed' in server.lookup_native_tool('GET_PLAYER_PED'); print('data tools ok')"

      - name: Run MCP server tests
        working-directory: mcp-server
        run: python -m pytest -q
